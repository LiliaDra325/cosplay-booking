<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>妆造预约 | Cosplay Studio</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
:root {
    /* 暖色基底 */
    --cream: #F3EAE3;
    --warm-white: #FFF9F5;

    /* 蓝色系 */
    --night-blue: #252D46;
    --dusty-blue: #7188A8;
    --deep-blue: #394967;

    /* 红色系 */
    --wine-red: #963F52;
    --rose-red: #C47D80;

    /* 装饰色 */
    --antique-gold: #C2A477;

    /* 文字 */
    --text-color: #403943;
}
    
body {
    background: var(--cream);
    color: var(--text-color);
    font-family: "Microsoft YaHei", sans-serif;
}

header {
    padding: 25px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--warm-white);
    border-bottom: 1px solid var(--antique-gold);
}
.logo {
    font-size: 22px;
    font-weight: bold;
    color: var(--wine-red);
}

nav a {
    text-decoration: none;
    color: var(--deep-blue);
    margin-left: 20px;
}

.hero {
    text-align: center;
    padding: 110px 20px;
    background: var(--night-blue);
    color: var(--warm-white);
    position: relative;
}

.hero h1 {
    font-size: 38px;
    margin-bottom: 20px;
    color: var(--warm-white);
}

.hero p {
    line-height: 2;
    color: #D5C5C5;
}

.button {
    display: inline-block;
    margin-top: 30px;
    padding: 13px 35px;
    background: var(--wine-red);
    color: var(--warm-white);
    border: 1px solid var(--antique-gold);
    border-radius: 30px;
    text-decoration: none;
    transition: 0.3s;
}
.button:hover {
    background: var(--dusty-blue);
    color: white;
}

.section {
    padding: 65px 20px;
    text-align: center;
}

.section h2 {
    margin-bottom: 25px;
}


.card {
    display: inline-block;
    padding: 30px;
    margin: 10px;
    background: var(--warm-white);
    border: 1px solid var(--dusty-blue);
    border-radius: 18px;
    width: 220px;
    box-shadow: 0 5px 20px #252D4620;
    transition: 0.3s;
}
.card:hover {
    transform: translateY(-5px);
    border-color: var(--wine-red);
}

footer {
    text-align: center;
    padding: 30px;
    background: var(--night-blue);
    color: var(--antique-gold);
}
</style>
</head>

<body>

<header>
    <div class="logo">♡ Cosplay Studio</div>
    <nav>
        <a href=" ">关于</a >
        <a href="#service">妆造服务</a >
        <a href="#booking">预约</a >
    </nav>
</header>

<section class="hero">
    <h1>欢迎来到我的妆造小屋 ♡</h1>
    <p>闪耀于漆黑边界的视线</p >
    <p>Let your fantasy shine in the darkness.</p >
    <p>与我签订魔法的契约吧！</p>
    <a href="#booking" class="button">开始预约 →</a >
</section>

<section class="section" id="about">
    <h2>About Me ✿</h2>
    <p>用心完成每一次妆造，期待与你相遇。</p >
</section>

<section class="section" id="service">
    <h2>Service ♡</h2>

    <div class="card">
        <h3>妆造服务</h3>
        <p>选择喜欢的角色妆面</p >
    </div>

    <div class="card">
        <h3>假发服务</h3>
        <p>选择心仪的假发造型</p >
    </div>

    <div class="card">
        <h3>附加服务</h3>
        <p>打造专属细节</p >
    </div>
</section>

<section class="section" id="booking">
    <h2>Make an Appointment ♡</h2>
    <p>期待与你一起完成下一次的冒险</p >
    <a href="mailto:example@email.com" class="button">
        联系我预约
    </a >
</section>

<footer>
    Made with ♡ and a little magic.
    <br><span class="emoji emojia9"></span> Cosplay Studio
</footer>

</body>
</html>
